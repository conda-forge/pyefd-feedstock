{% set name = "pyefd" %}
{% set version = "1.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyefd-{{ version }}.tar.gz
  sha256: 6346ef09a8ac4adca23841881e33f17fb5c0b75e24cf710cccd3004efc3a76ce
  patches:
    - setup.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - pytest-runner
    - python >=2.7
  run:
    - numpy >=1.7.0
    - python >=2.7

test:
  imports:
    - pyefd
  commands:
    - pip list
    - pip check
    - python -c 'from pyefd import elliptic_fourier_descriptors'
  requires:
    - pip

about:
  home: https://pypi.org/project/pyefd
  summary: Python implementation of "Elliptic Fourier Features of a Closed Contour"
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - goanpeca
